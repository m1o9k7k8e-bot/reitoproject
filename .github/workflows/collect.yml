name: Collect Reito pachinko data

on:
  workflow_dispatch:
  schedule:
    # 毎日23:30 JST
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect Reito data
        run: python collector.py --out data --sleep 0.35

      - name: Build dashboard
        run: python build_site.py

      - name: Save collected data
        run: |
          git config user.name "reito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update pachinko data"
          git push
