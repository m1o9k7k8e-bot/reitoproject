name: Build today review 20260826

on:
  push:
    branches: [main]
    paths: [today_review_20260826.signal]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build neutral review report from saved CSV only
        run: |
          python - <<'PY'
          import csv, json
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta, time
          from zoneinfo import ZoneInfo
          JST=ZoneInfo('Asia/Tokyo')
          rows=[]
          with open('data/daily_records.csv',encoding='utf-8-sig') as f:
            for r in csv.DictReader(f):
              try:
                stamp=datetime.strptime(r['collected_at'],'%Y-%m-%d %H:%M:%S').replace(tzinfo=timezone.utc).astimezone(JST)
              except Exception:
                continue
              if stamp.time() <= time(3,30):
                bd=(datetime.strptime(r['record_date'],'%Y-%m-%d').date()-timedelta(days=1)).isoformat()
              elif stamp.time() >= time(22,45):
                bd=r['record_date']
              else:
                continue
              try:
                hits=int(r['big_hits'])
                mb=int(r['max_balls']) if r.get('max_balls') not in ('',None) else 0
              except Exception:
                continue
              rows.append({**r,'business_date':bd,'hits':hits,'mb':mb})
          per={}
          for r in rows:
            k=(r['machine_number'],r['business_date'])
            if k not in per or r['collected_at']>per[k]['collected_at']:
              per[k]=r
          by=defaultdict(list)
          for r in per.values(): by[r['machine_number']].append(r)
          out=[]
          for num,recs in by.items():
            recs=sorted(recs,key=lambda x:x['business_date'])
            latest=recs[-1]
            if latest['business_date']!='2026-08-25':
              continue
            mid=latest['machine_id']
            current=[]
            for r in reversed(recs):
              if r['machine_id']!=mid: break
              current.append(r)
            current=list(reversed(current))
            streak=[]
            for r in reversed(current):
              if r['hits']==0: streak.append(r)
              else: break
            streak=list(reversed(streak))
            maxmb=max([r['mb'] for r in streak] or [0])
            if streak:
              out.append({
                'machine_number':num,
                'machine_name':latest['machine_name'],
                'business_date':'2026-08-25',
                'zero_streak_days':len(streak),
                'streak_start':streak[0]['business_date'],
                'streak_max_balls':maxmb,
                'latest_max_balls':latest['mb'],
                'review_note':'要累計スタート確認' if maxmb>30 else '未稼働の可能性あり'
              })
          out.sort(key=lambda x:(0 if x['review_note']=='要累計スタート確認' else 1,-x['zero_streak_days'],-x['streak_max_balls'],x['machine_number']))
          with open('data/today_review_20260826.json','w',encoding='utf-8') as f:
            json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Save report
        run: |
          git config user.name "reito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today_review_20260826.json
          git diff --cached --quiet || git commit -m "Build 2026-08-26 neutral review report"
          git push
