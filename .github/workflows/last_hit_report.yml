name: Build last-hit report

on:
  push:
    branches: [main]
    paths:
      - last_hit_report.signal

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build report from saved closed-day snapshots only
        run: |
          python - <<'PY'
          import csv, json
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta, time
          from zoneinfo import ZoneInfo

          JST=ZoneInfo('Asia/Tokyo')
          accepted=[]
          with open('data/daily_records.csv',encoding='utf-8-sig') as f:
            for r in csv.DictReader(f):
              try:
                stamp_utc=datetime.strptime(r['collected_at'],'%Y-%m-%d %H:%M:%S').replace(tzinfo=timezone.utc)
                stamp=stamp_utc.astimezone(JST)
              except Exception:
                continue
              # Nightly collector runs shortly after midnight JST; treat as prior business day.
              if stamp.time() <= time(3,30):
                bd=(datetime.strptime(r['record_date'],'%Y-%m-%d').date()-timedelta(days=1)).isoformat()
              elif stamp.time() >= time(22,45):
                bd=r['record_date']
              else:
                continue
              if r.get('big_hits') in ('',None):
                continue
              try:
                hits=int(r['big_hits'])
                mb=int(r['max_balls']) if r.get('max_balls') not in ('',None) else None
              except Exception:
                continue
              accepted.append({**r,'business_date':bd,'hits':hits,'max_balls_i':mb})

          # Latest accepted snapshot for each machine/business date.
          per={}
          for r in accepted:
            k=(r['machine_number'],r['business_date'])
            if k not in per or r['collected_at'] > per[k]['collected_at']:
              per[k]=r

          by=defaultdict(list)
          for r in per.values():
            by[r['machine_number']].append(r)

          all_rows=[]
          for num,recs in by.items():
            recs=sorted(recs,key=lambda x:(x['business_date'],x['collected_at']))
            latest=recs[-1]
            current_mid=latest['machine_id']
            current=[r for r in recs if r['machine_id']==current_mid]
            last_hit=None
            for r in current:
              if r['hits']>0:
                last_hit=r
            latest_bd=latest['business_date']
            last_date=last_hit['business_date'] if last_hit else None
            days_since=(datetime.strptime(latest_bd,'%Y-%m-%d').date()-datetime.strptime(last_date,'%Y-%m-%d').date()).days if last_date else None
            zero_days=[]
            for r in reversed(current):
              if r['hits']==0:
                zero_days.append(r)
              else:
                break
            zero_days=list(reversed(zero_days))
            max_zero=max([r['max_balls_i'] or 0 for r in zero_days] or [0])
            all_rows.append({
              'machine_number':num,
              'machine_id':current_mid,
              'machine_name':latest['machine_name'],
              'latest_business_date':latest_bd,
              'last_hit_date':last_date,
              'last_hit_count':last_hit['hits'] if last_hit else None,
              'days_since_last_hit_calendar':days_since,
              'consecutive_closed_days_zero':len(zero_days),
              'zero_streak_start':zero_days[0]['business_date'] if zero_days else None,
              'zero_streak_max_balls':max_zero,
              'activity_note':'要累計スタート確認' if max_zero>30 else '未稼働の可能性あり'
            })

          cutoff='2026-08-20'
          older=[r for r in all_rows if r['last_hit_date'] is None or r['last_hit_date']<=cutoff]
          older.sort(key=lambda r:(r['last_hit_date'] is not None, r['last_hit_date'] or '', -r['consecutive_closed_days_zero'], r['machine_number']))
          with open('data/last_hit_report.json','w',encoding='utf-8') as f:
            json.dump({'cutoff':cutoff,'latest_business_date':max((r['latest_business_date'] for r in all_rows),default=None),'count':len(older),'rows':older},f,ensure_ascii=False,indent=2)
          PY
      - name: Save report
        run: |
          git config user.name "reito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_hit_report.json
          git diff --cached --quiet || git commit -m "Build last-hit report"
          git push
