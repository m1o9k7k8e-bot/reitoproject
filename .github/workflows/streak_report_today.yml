name: Build current zero-hit streak report

on:
  push:
    branches: [main]
    paths:
      - streak_report_today.signal

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current report from saved CSV only
        run: |
          python - <<'PY'
          import csv, json
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          JST=ZoneInfo('Asia/Tokyo')
          rows=[]
          with open('data/daily_records.csv',encoding='utf-8-sig') as f:
            for r in csv.DictReader(f):
              try:
                stamp=datetime.strptime(r['collected_at'],'%Y-%m-%d %H:%M:%S').replace(tzinfo=timezone.utc).astimezone(JST)
              except Exception: continue
              if stamp.hour <= 3:
                bd=(datetime.strptime(r['record_date'],'%Y-%m-%d').date()-timedelta(days=1)).isoformat()
              elif stamp.hour >= 22:
                bd=r['record_date']
              else:
                continue
              if not r['big_hits']: continue
              rows.append({**r,'business_date':bd,'big_hits_i':int(r['big_hits'])})
          per={}
          for r in rows:
            k=(r['machine_number'],r['business_date'])
            if k not in per or r['collected_at']>per[k]['collected_at']: per[k]=r
          by=defaultdict(list)
          for r in per.values(): by[r['machine_number']].append(r)
          out=[]
          for num,recs in by.items():
            recs=sorted(recs,key=lambda x:x['business_date'])
            latest=recs[-1]; mid=latest['machine_id']
            gen=[]
            for r in reversed(recs):
              if r['machine_id']!=mid: break
              gen.append(r)
            gen=list(reversed(gen))
            streak=[]
            for r in reversed(gen):
              if r['big_hits_i']==0: streak.append(r)
              else: break
            if not streak: continue
            streak=list(reversed(streak))
            mb=[int(r['max_balls']) for r in streak if r['max_balls'] not in ('',None)]
            out.append({'machine_number':num,'machine_name':latest['machine_name'],'zero_streak_days':len(streak),'streak_start':streak[0]['business_date'],'latest_business_date':streak[-1]['business_date'],'streak_max_balls_max':max(mb or [0]),'activity_hint':'要累計スタート確認' if max(mb or [0])>30 else '未稼働の可能性高め'})
          out.sort(key=lambda x:(0 if x['activity_hint']=='要累計スタート確認' else 1,-x['zero_streak_days'],-x['streak_max_balls_max'],x['machine_number']))
          with open('data/zero_hit_streak_today.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Save
        run: |
          git config user.name "reito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/zero_hit_streak_today.json
          git diff --cached --quiet || git commit -m "Build current zero-hit streak report"
          git push
