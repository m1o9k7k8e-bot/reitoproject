name: Enrich cumulative start from saved data

on:
  push:
    branches:
      - main
    paths:
      - enrich_total_start.signal

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Enrich cumulative start from saved detail HTML
        run: python enrich_total_start.py
      - name: Save enriched database and CSV
        run: |
          git config user.name "reito-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reito.sqlite data/daily_records.csv
          git diff --cached --quiet || git commit -m "Enrich cumulative start from saved details"
          git push
